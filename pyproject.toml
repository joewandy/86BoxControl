[project]
name = "retrobridge98"
version = "0.3.0"
description = "A native Windows 98 client for a modern browser rendered on Windows or macOS"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "lz4>=4.4,<5",
  "pillow>=11.0,<12",
  "playwright>=1.54,<2",
  "psutil>=7.0,<8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
retrobridge = "retrobridge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["host/retrobridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
